name: Publish Performatron 3000 v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: companion/go.mod

      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          Push-Location companion
          go build -trimpath -ldflags="-s -w" -o ../package/performatron-companion.exe .
          Pop-Location

          Copy-Item companion/run-hidden.vbs package/run-hidden.vbs
          Compress-Archive -Path extension\* -DestinationPath package\extension.zip -Force

          @"
          PERFORMATRON 3000 v0.1.1 — QUICK START

          1. Abra o Discord Desktop.
          2. Rode performatron-companion.exe (ou run-hidden.vbs para abrir escondido).
          3. Extraia extension.zip.
          4. Chrome/Edge > Extensões > Modo do desenvolvedor > Carregar sem compactação > selecione a pasta extraída.
          5. Crie uma aplicação em https://discord.com/developers/applications, de preferência chamada YouTube.
          6. Copie o Application ID e cole na extensão. NÃO use Bot Token.
          7. Abra uma música no YouTube e clique em PERFORMAR NO DISCORD.

          v0.1.1:
          - Rich Presence do tipo Listening.
          - Capa quadrada opcional.
          - Limpeza automática de títulos.
          - "Artist | Song" vira artista + música corretamente.
          - Remove tudo após ft., feat. ou featuring no título.
          "@ | Set-Content -Path package\LEIA-ME.txt -Encoding UTF8

          Compress-Archive -Path package\* -DestinationPath performatron3000-windows-v0.1.1.zip -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          ## Performatron 3000 v0.1.1

          Rich Presence de música do **YouTube normal** no Discord, sem aparecer como "Jogando YouTube".

          ### O que tem
          - Atividade **Listening** com nome da música, artista, capa, progresso e botão para abrir no YouTube.
          - Liga/desliga manualmente para você só performar quando quiser.
          - Capa quadrada automática para thumbs com artwork no meio e barras laterais.
          - Detecta play, pause, seek e troca de vídeo.
          - Limpa títulos como `(Official Music Video)`, `[Lyrics]`, `- Topic` e afins.
          - `Passenger | Let Her Go` vira **Let Her Go** / **Passenger**.
          - Remove tudo que vier depois de `ft.`, `feat.` ou `featuring`.

          ### Instalação
          Baixe **performatron3000-windows-v0.1.1.zip**, extraia e siga o `LEIA-ME.txt`.

          Não precisa de Bot Token. Só do Application ID público de uma aplicação no Discord Developer Portal.
          "@ | Set-Content -Path RELEASE.md -Encoding UTF8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 .\performatron3000-windows-v0.1.1.zip --target "$env:GITHUB_SHA" --title "Performatron 3000 v0.1.1" --notes-file RELEASE.md
