name: Publish Performatron 3000 v0.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.4.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: companion/go.mod

      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          Push-Location companion
          go build -trimpath -ldflags="-s -w" -o ../package/performatron-companion.exe .
          Pop-Location

          Copy-Item companion/run-hidden.vbs package/run-hidden.vbs

          # Extension-only ZIP for people who already have the companion.
          Compress-Archive -Path extension\* -DestinationPath performatron3000-extension-v0.1.4.zip -Force
          Copy-Item performatron3000-extension-v0.1.4.zip package/extension.zip

          @"
          PERFORMATRON 3000 v0.1.4 — QUICK START

          1. Abra o Discord Desktop.
          2. Rode performatron-companion.exe (ou run-hidden.vbs para abrir escondido).
          3. Extraia extension.zip.
          4. Chrome/Edge > Extensões > Modo do desenvolvedor > Carregar sem compactação > selecione a pasta extraída.
          5. Crie uma aplicação em https://discord.com/developers/applications, de preferência chamada YouTube.
          6. Copie o Application ID e cole na extensão. NÃO use Bot Token.
          7. Abra uma música no YouTube e clique em PERFORMAR NO DISCORD.

          v0.1.4:
          - Remove qualquer trecho entre parênteses do título antes de mandar ao Discord.
          - Suporta até parênteses aninhados, como Song (Live (Acoustic)).
          - Release agora inclui um ZIP separado contendo SOMENTE a extensão.
          "@ | Set-Content -Path package\LEIA-ME.txt -Encoding UTF8

          Compress-Archive -Path package\* -DestinationPath performatron3000-windows-v0.1.4.zip -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          ## Performatron 3000 v0.1.4

          Atualização focada em deixar títulos ainda mais limpos e facilitar updates da extensão.

          ### Novo
          - Remove qualquer trecho entre parênteses do título, incluindo os próprios parênteses.
          - Funciona também com parênteses aninhados: `Song (Live (Acoustic))` vira **Song**.
          - Agora toda release traz **dois downloads**:
            - `performatron3000-extension-v0.1.4.zip` — somente a extensão, para quem já tem o companion.
            - `performatron3000-windows-v0.1.4.zip` — pacote completo com companion + extensão.

          ### Instalação rápida da extensão
          Se você já usa o Performatron, baixe apenas **performatron3000-extension-v0.1.4.zip**, extraia e recarregue/substitua a pasta da extensão no Chrome/Edge.
          "@ | Set-Content -Path RELEASE.md -Encoding UTF8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.4 `
            .\performatron3000-extension-v0.1.4.zip `
            .\performatron3000-windows-v0.1.4.zip `
            --target "$env:GITHUB_SHA" `
            --title "Performatron 3000 v0.1.4" `
            --notes-file RELEASE.md
