name: Publish Performatron 3000 v0.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.5.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: companion/go.mod

      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          Push-Location companion
          go build -trimpath -ldflags="-s -w" -o ../package/performatron-companion.exe .
          Pop-Location

          Copy-Item companion/run-hidden.vbs package/run-hidden.vbs

          Compress-Archive -Path extension\* -DestinationPath performatron3000-extension-v0.1.5.zip -Force
          Copy-Item performatron3000-extension-v0.1.5.zip package/extension.zip

          @"
          PERFORMATRON 3000 v0.1.5 — QUICK START

          1. Abra o Discord Desktop.
          2. Rode performatron-companion.exe (ou run-hidden.vbs para abrir escondido).
          3. Extraia extension.zip.
          4. Chrome/Edge > Extensões > Modo do desenvolvedor > Carregar sem compactação > selecione a pasta extraída.
          5. Crie uma aplicação em https://discord.com/developers/applications, de preferência chamada YouTube.
          6. Copie o Application ID e cole na extensão. NÃO use Bot Token.
          7. Abra uma música no YouTube e clique em PERFORMAR NO DISCORD.

          v0.1.5:
          - Remove qualquer trecho entre parênteses OU colchetes do título.
          - Suporta grupos aninhados e misturados, como Song (Live [Acoustic]).
          - Mantém os downloads separados da extensão e do pacote completo.
          "@ | Set-Content -Path package\LEIA-ME.txt -Encoding UTF8

          Compress-Archive -Path package\* -DestinationPath performatron3000-windows-v0.1.5.zip -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          ## Performatron 3000 v0.1.5

          Mais uma limpeza de metadata do YouTube.

          ### Novo
          - Remove qualquer trecho entre `()` **ou** `[]`, incluindo os próprios símbolos.
          - Também funciona com grupos aninhados/misturados: `Song (Live [Acoustic]) [Remastered]` vira **Song**.
          - Continua trazendo dois downloads:
            - `performatron3000-extension-v0.1.5.zip` — somente a extensão.
            - `performatron3000-windows-v0.1.5.zip` — pacote completo com companion + extensão.

          ### Instalação rápida da extensão
          Se você já tem o companion, baixe só **performatron3000-extension-v0.1.5.zip**, extraia e recarregue a extensão no Chrome/Edge.
          "@ | Set-Content -Path RELEASE.md -Encoding UTF8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.5 `
            .\performatron3000-extension-v0.1.5.zip `
            .\performatron3000-windows-v0.1.5.zip `
            --target "$env:GITHUB_SHA" `
            --title "Performatron 3000 v0.1.5" `
            --notes-file RELEASE.md
